openapi: 3.2.0
info:
  title: MonsiTools Calculation Api Tools.json API
  version: 1.0.0
  termsOfService: https://monsitools.com/terms
  description: 'Send a calculator''s inputs, get its result back as JSON. Premium accounts, 60 requests per minute. Authenticate with an API key from Dashboard > API access (Authorization: Bearer mt_live_...). Tools and their input ids: /api-tools.json. Every call made with your account is counted in its usage, shown on the dashboard.'
servers:
- url: https://monsitools.com
security:
- bearerAuth: []
tags:
- name: Api Tools.json
paths:
  /api-tools.json:
    get:
      operationId: listTools
      summary: Every tool the API accepts, with its input ids
      security: []
      responses:
        '200':
          description: Map of slug to tool.
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  $ref: '#/components/schemas/Tool'
      tags:
      - Api Tools.json
components:
  schemas:
    Tool:
      type: object
      properties:
        name:
          type: string
        category:
          type: string
        inputs:
          type: array
          items:
            type: string
        formula:
          type: string
        premium:
          type: boolean
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: An API key (mt_live_...) for /api/calculate; a signed-in session token for /api/keys.
