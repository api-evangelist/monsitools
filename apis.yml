aid: monsitools
name: MonsiTools
image: https://monsitools.com/og/default.png
description: 'MonsiTools is a calculator and workflow builder: people build calculators
  by typing a formula in plain words and chain them into workflows. It ships 1262
  ready-made browser calculators and data tools for business, finance, SaaS metrics,
  ecommerce and marketing, plus a JSON Calculation API (premium, 60 requests per minute,
  Bearer mt_live_ keys) and a remote MCP server at monsitools.com/mcp.'
